<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
    <title>Login</title>
</head>
<body>
<section class="container">
    <h1 class="text text-center text-info mt-2">ĐĂNG KÝ</h1>
    <form method="post">
        <div class="container form-floating mb-3 mt-3">
            <input type="text" placeholder="Nhập username" class="form-control" id="username" name="username">
            <label for="username">Tên đăng ký</label>
        </div>
        <div class="container form-floating mb-3 mt-3">
            <input type="text" placeholder="Nhập password" class="form-control" id="password" name="password">
            <label for="password">Mật khẩu</label>
        </div>
        <div class="container form-floating mb-3 mt-3">
            <button class="btn btn-success">Đăng ký</button>
        </div>
    </form>
</section>
</body>
</html>

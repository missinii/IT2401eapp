<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
</head>
<body>
<!-- Thanh Navbar giữ nguyên như index.html -->
<nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">SaleApp</a>
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Homepage</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">All</a></li>
                {% for c in categories %}
                <li class="nav-item">
                    <a class="nav-link" href="/?category_id={{c.id}}">{{c.name}}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>

<!-- Nội dung chi tiết sản phẩm -->
<section class="container mt-4">
    {% if product %}
    <div class="row">
        <div class="col-md-5 col-12">
            <img src="{{ product.image }}" class="img-fluid rounded" alt="{{ product.name }}">
        </div>
        <div class="col-md-7 col-12">
            <h1 class="text-primary">{{ product.name }}</h1>
            <h3 class="text-danger">{{ product.price }} VND</h3>
            <p class="mt-3">{{ product.description }}</p>
            <a href="/" class="btn btn-secondary mt-3">Quay lại trang chủ</a>
        </div>
    </div>
    {% else %}
    <div class="alert alert-danger">Không tìm thấy sản phẩm!</div>
    {% endif %}
</section>
</body>
</html>
